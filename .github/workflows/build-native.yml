name: Build & Release Jolt Native (.exe + Installer)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-native:
    runs-on: windows-latest
    steps:
      - name: Checkout Jolt
        uses: actions/checkout@v4

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile, Run Unit Tests & Package jolt.jar
        shell: pwsh
        run: |
          $null = New-Item -ItemType Directory -Force -Path build\classes, build\native
          $sources = (Get-ChildItem -Path src\main\java, src\test\java -Recurse -Filter *.java).FullName
          javac -d build\classes $sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -ea -cp build\classes dev.jolt.Phase2CoreTest
          java -ea -cp build\classes dev.jolt.Phase3ResolverTest
          java -ea -cp build\classes dev.jolt.Phase4InstallerTest
          java -ea -cp build\classes dev.jolt.Phase5And6Test

          jar --create --file build\jolt.jar --main-class dev.jolt.Main -C build\classes .

      - name: Compile Standalone Native fast.exe
        shell: pwsh
        run: |
          native-image `
            -O3 `
            -march=compatibility `
            --gc=serial `
            --no-fallback `
            --enable-url-protocols=https,http `
            -R:MinHeapSize=16m `
            -R:MaxHeapSize=512m `
            -cp build\jolt.jar `
            dev.jolt.Main `
            -o build\native\fast

      - name: Build Windows GUI Installer (JoltSetup-x64.exe)
        shell: pwsh
        run: |
          .\build\native\fast.exe --help
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer\jolt.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          Copy-Item build\native\fast.exe build\native\fast-windows-x64.exe -Force
          $setupHash = (Get-FileHash build\native\JoltSetup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash   = (Get-FileHash build\native\fast-windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = "$setupHash  JoltSetup-x64.exe`n$exeHash  fast-windows-x64.exe`n"
          [System.IO.File]::WriteAllText("$PWD\build\native\SHA256SUMS.txt", $sums)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jolt-windows-x64
          path: |
            build/native/JoltSetup-x64.exe
            build/native/fast-windows-x64.exe
            build/native/SHA256SUMS.txt

      - name: Publish GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/native/JoltSetup-x64.exe
            build/native/fast-windows-x64.exe
            build/native/SHA256SUMS.txt